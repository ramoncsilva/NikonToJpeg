[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nikon2jpeg"
version = "0.1.0"
description = "Convert Nikon NEF files to social-media-ready JPEGs with dust and noise removal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rawpy>=0.21",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "Pillow>=10.3",
    "piexif>=1.1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pyinstaller>=6"]

[project.scripts]
nikon2jpeg = "nikon2jpeg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nikon2jpeg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
